# OpenTelemetry Collector — общая точка приёма телеметрии (требование Части 4).
#
# Режим DaemonSet: на каждой ноде коллектор
#   * читает логи контейнеров с диска (filelog) и шлёт их в Loki;
#   * принимает OTLP-трейсы от sidecar'ов Istio и шлёт их в Tempo;
#   * отдаёт собственные метрики Prometheus.

fullnameOverride: opentelemetry-collector
mode: daemonset

image:
  # contrib-сборка: в ней есть exporter'ы loki/otlp и receiver filelog,
  # которых нет в core-образе.
  repository: otel/opentelemetry-collector-contrib

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

# В режиме daemonset чарт по умолчанию Service НЕ создаёт (предполагается
# доступ к node-local агенту через hostPort). Istio же шлёт трейсы на
# DNS-имя сервиса, поэтому Service включаем явно — без него spans просто
# никуда не уходят, а в логах istio-proxy нет ни одной ошибки.
service:
  enabled: true

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    # Istio шлёт spans в формате Zipkin (см. комментарий в istio-operator.yaml).
    # Коллектор остаётся единой точкой приёма: принимает Zipkin и OTLP,
    # а наружу в Tempo отдаёт уже только OTLP.
    zipkin:
      endpoint: 0.0.0.0:9411

  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    # Ограничитель памяти: без него всплеск логов в нагрузочном тесте
    # Части 6 способен уронить коллектор по OOM.
    memory_limiter:
      check_interval: 2s
      limit_percentage: 80
      spike_limit_percentage: 20
    resource:
      attributes:
        - key: cluster
          value: booking
          action: upsert

  exporters:
    # Логи -> Loki. Метки берутся из атрибутов, добавленных
    # пресетом kubernetesAttributes.
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
    # Трейсы -> Tempo.
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    debug:
      verbosity: basic

  service:
    pipelines:
      logs:
        receivers: [otlp, filelog]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/loki]
      traces:
        receivers: [otlp, zipkin]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
