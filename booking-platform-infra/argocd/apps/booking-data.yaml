---
# Слой данных: PostgreSQL (4 логические БД), MongoDB, Valkey.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: booking-data
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:lalefrutto/booking-platform.git
    targetRevision: main
    path: booking-platform-infra/charts/booking-data
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: booking-data

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

  # PVC у StatefulSet неизменяемы после создания: ArgoCD иначе бесконечно
  # пытался бы «починить» их и показывал приложение как OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
