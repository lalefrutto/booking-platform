{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- $d := $root.Values.defaults }}
{{- $kedaOn := and $svc.keda $svc.keda.enabled $root.Values.keda.enabled }}
{{- if and $d.hpa.enabled (not $kedaOn) }}
---
# Обычный HPA по CPU для сервисов, у которых нет внешнего триггера.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: booking-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $d.hpa.minReplicas }}
  maxReplicas: {{ $d.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $d.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      # Реагируем быстро, чтобы всплеск нагрузки в Части 6 было видно.
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}
{{- if $kedaOn }}
---
# KEDA масштабирует consumer'а по лагу Kafka, а не по CPU: потребитель
# событий может быть перегружен очередью, почти не нагружая процессор,
# и CPU-HPA такой ситуации просто не увидит.
#
# KEDA сам создаёт под капотом HPA, поэтому отдельный HPA для этого
# Deployment не рендерится — иначе два автоскейлера дрались бы за replicas.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: booking-platform
spec:
  scaleTargetRef:
    name: {{ $name }}
  minReplicaCount: {{ $svc.keda.minReplicas | default 1 }}
  maxReplicaCount: {{ $svc.keda.maxReplicas | default 5 }}
  pollingInterval: 10
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 120
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ $root.Values.global.kafkaBootstrap | quote }}
        consumerGroup: {{ $svc.keda.consumerGroup | quote }}
        topic: {{ $svc.keda.topic | quote }}
        lagThreshold: {{ $svc.keda.lagThreshold | quote }}
        offsetResetPolicy: earliest
        # Не скейлим в ноль: consumer должен оставаться подписанным,
        # иначе лаг просто некому будет разгребать после простоя.
        allowIdleConsumers: "false"
{{- end }}
{{- end }}
