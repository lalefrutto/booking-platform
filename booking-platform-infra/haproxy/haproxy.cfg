global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    retries 2

# Статистика HAProxy: видно, какие бэкенды живы и как распределяется нагрузка.
frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s

frontend booking_in
    bind *:80
    default_backend istio_ingress

# Балансируем на NodePort Istio Ingress Gateway на всех трёх нодах k3d.
# Проверка живости — по /api/hotels/health, то есть по реальному пути
# приложения через gateway, а не просто по открытому TCP-порту.
backend istio_ingress
    balance roundrobin
    option httpchk
    # ver HTTP/1.1 + hdr Host обязательны: по умолчанию HAProxy шлёт проверку
    # как HTTP/1.0 без заголовка Host, а Envoy на такой запрос отвечает
    # 426 Upgrade Required — бэкенды навсегда остаются DOWN.
    http-check send meth GET uri /api/hotels/health ver HTTP/1.1 hdr Host booking.local
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server node0 172.20.0.3:30080 check
    server node1 172.20.0.4:30080 check
    server node2 172.20.0.5:30080 check
